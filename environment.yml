# Environment for the Ty1/copia Gag PrLD pipeline.
#
# Linux only. mmseqs2, mafft, trimal and iqtree have no win-64 builds, so on
# Windows this runs under WSL. The Anaconda default channels are deliberately
# not used -- conda-forge and bioconda only, which also avoids their licence
# terms for institutional use.
#
#   conda env create -f environment.yml
#   conda activate copia-prld
#
# PLAAC is a Java jar and is not on conda; download it separately.
name: copia-prld

channels:
  - conda-forge
  - bioconda

dependencies:
  - python=3.12

  # Clustering, alignment, phylogenetics
  - mmseqs2=18.8cc5c
  - mafft=7.525
  - trimal=1.5.1
  - iqtree=3.1.3

  # Runs the PLAAC jar
  - openjdk=21

  # metapredict's model runs on torch; the conda-forge build is CPU-only, which
  # is what we want -- pip would pull ~2.5 GB of CUDA wheels instead.
  - pytorch=2.9.1
  - numpy=2.3.5

  # Figures. ggtree is the reason for R -- nothing in Python matches it for
  # trait-annotated phylogenies.
  - r-base=4.5.3
  - r-ggplot2=4.0.3
  - r-dplyr=1.2.1
  - r-readr=2.2.0
  - r-patchwork=1.3.2
  - r-scales=1.4.0
  - r-ape=5.8_1
  - bioconductor-ggtree=4.0.4

  # metapredict has Cython extensions that build from source, so the env needs
  # its own compiler rather than relying on one being installed system-wide.
  - c-compiler
  - cython

  - pip
  - pip:
      # Disorder prediction (L-6). V2, not V3 -- it is the version published
      # disorder comparisons cite, so scores are interpretable against them.
      - metapredict==2.65.1
